name: CI

# The AI SDK's five packages built and tested on macOS 27, the iOS 27
# simulator and Linux. They depend on ModelBoard by path, so it is checked
# out beside this repository the way the monorepo keeps them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.package }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        package: [ai-core, ai-gateway, anthropic, openai, openrouter]
    steps:
      - uses: actions/checkout@v4
        with:
          path: swift-packages/ai-sdk
      - uses: actions/checkout@v4
        with:
          repository: tessera-os/model-board
          path: swift-packages/model-board
      - name: Use the newest Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - name: Test
        working-directory: swift-packages/ai-sdk/${{ matrix.package }}
        run: swift test

  ios:
    name: iOS ${{ matrix.package }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        package: [ai-core, ai-gateway, anthropic, openai, openrouter]
    steps:
      - uses: actions/checkout@v4
        with:
          path: swift-packages/ai-sdk
      - uses: actions/checkout@v4
        with:
          repository: tessera-os/model-board
          path: swift-packages/model-board
      - name: Use the newest Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - name: Test on the iOS simulator
        working-directory: swift-packages/ai-sdk/${{ matrix.package }}
        # SwiftPM only, no xcodebuild: build the tests for the simulator,
        # then run each test bundle on a booted iPhone with xctest.
        run: |
          set -euo pipefail
          platform=$(xcrun --sdk iphonesimulator --show-sdk-platform-path)
          swift build --build-tests --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --triple arm64-apple-ios27.0-simulator
          device=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device"
          export SIMCTL_CHILD_DYLD_FRAMEWORK_PATH="$platform/Developer/Library/Frameworks"
          export SIMCTL_CHILD_DYLD_LIBRARY_PATH="$platform/Developer/usr/lib"
          find .build -maxdepth 5 -name '*.xctest' -path '*iphonesimulator*' -print0 \
            | while IFS= read -r -d '' bundle; do
                echo "Running $bundle on simulator $device"
                xcrun simctl spawn "$device" "$platform/Developer/Library/Xcode/Agents/xctest" "$PWD/$bundle"
              done

  linux:
    name: Linux ${{ matrix.package }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.2-noble
    strategy:
      fail-fast: false
      matrix:
        package: [ai-core, ai-gateway, anthropic, openai, openrouter]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          path: swift-packages/ai-sdk
      - uses: actions/checkout@v4
        with:
          repository: tessera-os/model-board
          path: swift-packages/model-board
      - name: Test
        working-directory: swift-packages/ai-sdk/${{ matrix.package }}
        run: swift test
